[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "esim-toolhub"
version = "0.1.0"
description = "eSim ToolHub - automated tool & dependency manager prototype for the eSim EDA ecosystem"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "eSim ToolHub contributors" }]
keywords = ["eSim", "FOSSEE", "EDA", "ngspice", "kicad", "ghdl", "verilator"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Environment :: Console",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "PyYAML>=6.0",
    "platformdirs>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10", "types-PyYAML"]

[project.scripts]
esim-toolhub = "esim_toolhub.main:run"

[project.urls]
"eSim" = "https://github.com/FOSSEE/eSim"
"eSim documentation" = "https://esim.readthedocs.io/"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
esim_toolhub = ["resources/*.yaml", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = [
    "S603",  # subprocess without shell: all calls go through SubprocessRunner with arg lists
    "S607",  # partial executable paths are resolved by design (winget, apt-get, ...)
    "RUF012",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "E501"]

[tool.mypy]
python_version = "3.10"
files = ["src/esim_toolhub"]
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
